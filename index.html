/* ---------- Public site ---------- */
function copyCode(codeEl,label){
  var code=codeEl.textContent;
  function done(){label.textContent='Copié ✓';setTimeout(function(){label.textContent='Copier'},1600)}
  function fallback(){try{var r=document.createRange();r.selectNodeContents(codeEl);var s=getSelection();s.removeAllRanges();s.addRange(r);label.textContent='Sélectionné'}catch(e){}}
  try{navigator.clipboard.writeText(code).then(done,fallback)}catch(e){fallback()}
}
function ticket(it){
  var c=catOf(it.cat),t=h('article','ticket');t.style.setProperty('--cat',c.c);
  var stub=h('div','stub');stub.appendChild(h('div','mono',(it.brand||'?').trim().charAt(0).toUpperCase()));stub.appendChild(h('div','catl',c.l));
  var b=h('div','tbody');b.appendChild(h('h3',null,it.brand));
  if(it.desc)b.appendChild(h('p',null,it.desc));
  if(it.code){
    var btn=h('button','codebtn');btn.type='button';btn.setAttribute('aria-label','Copier le code '+it.code);
    var ct=h('span','codetext',it.code),cp=h('span','copy','Copier');btn.appendChild(ct);btn.appendChild(cp);
    btn.addEventListener('click',function(){copyCode(ct,cp)});b.appendChild(btn);
  }
  var u=safeUrl(it.url);
  if(!it.code&&u){var go=h('a','go','Voir l\'offre');go.href=u;go.target='_blank';go.rel='noopener noreferrer';b.appendChild(go)}
  var m=h('div','meta');m.appendChild(h('span','pill '+(it.status||'check'),STATUS[it.status]||STATUS.check));
  if(it.when)m.appendChild(h('span',null,it.when));
  if(u&&it.code){var a=h('a',null,'Source'+(it.src?' : '+it.src:''));a.href=u;a.target='_blank';a.rel='noopener noreferrer';m.appendChild(a)}
  b.appendChild(m);t.appendChild(stub);t.appendChild(b);return t;
}
function logoNode(){
  var s=STATE.site.logo;
  if(s&&/^data:image\//.test(s)){var i=document.createElement('img');i.src=s;i.alt='';return i}
  var w=document.createElement('span');w.innerHTML=DEFAULT_LOGO;return w.firstChild;

function autoSticker(){
  var now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),bf=new Date(2026,10,27),cm=new Date(2026,10,30);
  var d=Math.round((bf-t0)/864e5);
  if(d>1)return 'Black Friday dans '+d+' jours';
  if(d===1)return 'Black Friday demain';
  if(d===0)return 'Black Friday, c\'est aujourd\'hui';
  if(t0<=cm)return 'Cyber Monday le 30 novembre';
  return 'Codes mis à jour régulièrement';
}

/* Connexion admin : l'accès réel reste réservé au compte propriétaire (canEdit + droit de publier). Ce formulaire ajoute une étape. */
async function sha(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [].map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0')}).join('')}
function authHash(id,pw){return sha(STATE.auth.salt+':'+id.trim().toLowerCase()+':'+pw)}
function unlocked(){try{return sessionStorage.getItem('pl-admin')==='1'}catch(e){return false}}
function setUnlocked(v){try{if(v)sessionStorage.setItem('pl-admin','1');else sessionStorage.removeItem('pl-admin')}catch(e){}}
function showLogin(){
  var back=h('div','login-back'),box=h('form','login');box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-label','Connexion admin');box.noValidate=true;
  var lg=h('span','logo');lg.style.background='var(--hero)';lg.style.borderRadius='14px';lg.style.padding='6px';lg.appendChild(logoNode());box.appendChild(lg);
  box.appendChild(h('h2',null,'Connexion admin'));box.appendChild(h('p',null,'Entre ton identifiant et ton mot de passe pour ouvrir le menu.'));
  var id=inp('text','','Identifiant',60);id.autocomplete='username';var pw=inp('password','','Mot de passe',100);pw.autocomplete='current-password';
  box.appendChild(field('Identifiant',id));box.appendChild(field('Mot de passe',pw));
  var err=h('p','ad-msg');err.setAttribute('role','alert');err.style.color='var(--danger)';box.appendChild(err);
  var row=h('div','login-row');var ok=btn('Se connecter','pri',function(){});ok.type='submit';
  var no=btn('Annuler','',function(){back.remove();ui.fab.focus()});row.appendChild(ok);row.appendChild(no);box.appendChild(row);
  box.addEventListener('submit',async function(e){
    e.preventDefault();ok.disabled=true;err.textContent='';
    try{
      if(!(window.crypto&&crypto.subtle)){err.textContent='Connexion indisponible dans ce navigateur.';return}
      var hh=await authHash(id.value,pw.value);
      if(hh===STATE.auth.h){setUnlocked(true);back.remove();openPanel()}
      else{await new Promise(function(r){setTimeout(r,700)});err.textContent='Identifiant ou mot de passe incorrect.';pw.value='';pw.focus()}
    }catch(x){err.textContent='Connexion impossible. Réessaie.'}
    finally{ok.disabled=false}
  });
  back.addEventListener('keydown',function(e){if(e.key==='Escape'){back.remove();ui.fab.focus()}});
  back.appendChild(box);document.body.appendChild(back);id.focus();
}

function buildDoc(){
  var rs=[].slice.call(document.head.querySelectorAll('style')).filter(function(s){return s.id!=='app-css'})[0];
  var reset=rs?rs.textContent:FALLBACK_RESET;
  var json=JSON.stringify(STATE).replace(/</g,'\\u003c');
  var content='<title>'+esc(STATE.site.name)+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+FONTLINK+'\n<style id="app-css">'+$('app-css').textContent+'</style>\n'+SHELL+'\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="app-js">'+APPJS+'<\/script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+content+'</body></html>';
}
async function doPublish(){
  say('Publication en cours…');ui.pub.disabled=true;
  try{
    var art=await claude.use('artifact');
    if(!art){say('Publication indisponible dans cette vue.');updateBar();return}
    await art.publish(buildDoc());
    say('Publié ✓ La page se recharge.');
  }catch(e){
    var c=e&&e.code;
    say(c==='conflict'?'Une version plus récente existe déjà. La page se recharge, refais ta modification.':
        c==='too_large'?'Page trop lourde. Importe un logo plus petit.':
        (c==='not_writer'||c==='not_granted')?'Tu n\'as pas le droit de publier cette page.':
        'Publication impossible. Réessaie dans un instant.');
    updateBar();
  }
}

    var main=h('div','ad-main');var nm=inp('text',c.l,'Nom',40);nm.className='nm';nm.setAttribute('aria-label','Nom de la catégorie');
    nm.addEventListener('input',function(){c.l=nm.value;changed()});nm.addEventListener('change',function(){if(!nm.value.trim()){c.l='Sans nom';nm.value=c.l;changed()}});
    main.appendChild(nm);main.appendChild(h('span','d',n+(n>1?' codes':' code')));row.appendChild(main);
    var pal=paletteRow(c.c,function(col){c.c=col;sw.style.background=col;changed()});pal.hidden=true;
    sw.addEventListener('click',function(){pal.hidden=!pal.hidden});
    var a=h('div','ad-actions');
    var up=btn('↑','',function(){var t=STATE.cats[i];STATE.cats[i]=STATE.cats[i-1];STATE.cats[i-1]=t;changed();renderPanel()},'Monter');up.disabled=i===0;
    var dn=btn('↓','',function(){var t=STATE.cats[i];STATE.cats[i]=STATE.cats[i+1];STATE.cats[i+1]=t;changed();renderPanel()},'Descendre');dn.disabled=i===STATE.cats.length-1;
    a.appendChild(up);a.appendChild(dn);
    var del=btn('Supprimer','danger',function(){});del.disabled=STATE.cats.length<2;
    arm(del,'Supprimer',function(){
      var other=STATE.cats.filter(function(x){return x!==c})[0];
      STATE.items.forEach(function(x){if(x.cat===c.k)x.cat=other.k});
      STATE.cats.splice(STATE.cats.indexOf(c),1);say(n?n+' code(s) déplacé(s) vers « '+other.l+' ».':'Catégorie supprimée.');changed();renderPanel()});
    a.appendChild(del);row.appendChild(pal);row.appendChild(a);list.appendChild(row);
  });
  box.appendChild(list);
  var card=h('div','card');card.appendChild(h('h3',null,'Ajouter une catégorie'));
  var picked=PALETTE[STATE.cats.length%PALETTE.length];var name=inp('text','','Ex : Abonnements',40);
  card.appendChild(field('Nom',name));card.appendChild(paletteRow(picked,function(col){picked=col}));
  card.appendChild(btn('Ajouter la catégorie','pri',function(){
    var v=name.value.trim();if(!v){say('Donne un nom à la catégorie.');name.focus();return}
    var k=(v.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'cat')+'-'+Math.random().toString(36).slice(2,5);
    STATE.cats.push({k:k,l:v,c:picked});say('Catégorie ajoutée.');changed();renderPanel()}));
  box.appendChild(card);
}

/* Site tab */
function renderSiteTab(box){
  var S=STATE.site;
  var card=h('div','card');card.appendChild(h('h3',null,'Textes du site'));
  var f=h('div','form');
  function bind(label,key,tag,wide,ph){var c=tag==='ta'?document.createElement('textarea'):inp('text',S[key],ph,300);if(tag==='ta')c.value=S[key]||'';
    c.addEventListener('input',function(){S[key]=c.value;changed()});f.appendChild(field(label,c,wide));return c}
  bind('Nom du site','name','',false,'PromoZip');bind('Titre, première partie','heroA','',false);bind('Titre, partie surlignée','heroB','',false);
  bind('Texte d\'introduction','intro','ta',true);
  bind('Autocollant jaune','sticker','',true,'Vide = compte à rebours Black Friday automatique');
  bind('Note en bas de page','footer','ta',true);
  var up=bind('Date du dernier relevé','updated','',false,'Ex : 19 novembre 2026');
  var td=btn('Mettre la date d\'aujourd\'hui','',function(){var v=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});S.updated=v;up.value=v;changed()});
  var tw=h('div','field');tw.style.justifyContent='flex-end';tw.appendChild(td);f.appendChild(tw);
  card.appendChild(f);box.appendChild(card);
  var lc=h('div','card');lc.appendChild(h('h3',null,'Logo'));lc.appendChild(h('p',null,'Importe ton propre logo (PNG, JPG, SVG ou WebP). Il est réduit automatiquement pour rester léger.'));
  var pr=h('div','logo-prev');var pv=h('span','logo');pv.appendChild(logoNode());pr.appendChild(pv);
  var file=document.createElement('input');file.type='file';file.accept='image/*';file.setAttribute('aria-label','Importer un logo');
  file.addEventListener('change',function(){
    var fl=file.files&&file.files[0];if(!fl)return;
    var rd=new FileReader();rd.onerror=function(){say('Lecture du fichier impossible.')};
    rd.onload=function(){var im=new Image();im.onerror=function(){say('Image illisible.')};
      im.onload=function(){var mx=320,sc=Math.min(1,mx/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*sc));cv.height=Math.max(1,Math.round(im.height*sc));
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);var out=cv.toDataURL('image/png');if(out.length>400000)out=cv.toDataURL('image/jpeg',.85);
        if(out.length>600000){say('Logo trop lourd. Choisis une image plus simple.');return}
        S.logo=out;say('Logo importé.');changed();renderPanel()};im.src=rd.result};
    rd.readAsDataURL(fl)});
  pr.appendChild(file);lc.appendChild(pr);
  lc.appendChild(btn('Revenir au logo PromoZip','',function(){S.logo='';say('Logo par défaut rétabli.');changed();renderPanel()}));
  box.appendChild(lc);
  var ac=h('div','card');ac.appendChild(h('h3',null,'Identifiants admin'));ac.appendChild(h('p',null,'Change ton identifiant et ton mot de passe. Ils sont enregistrés sous forme d\'empreinte, jamais en clair.'));
  var nid=inp('text','','Nouvel identifiant',60),npw=inp('password','','Nouveau mot de passe (8 caractères minimum)',100);npw.autocomplete='new-password';
  var af=h('div','form');af.appendChild(field('Nouvel identifiant',nid));af.appendChild(field('Nouveau mot de passe',npw));ac.appendChild(af);
  ac.appendChild(btn('Changer mes identifiants','',async function(){
    if(!nid.value.trim()){say('Indique un identifiant.');return}
    if(npw.value.length<8){say('Le mot de passe doit faire 8 caractères minimum.');return}
    if(!(window.crypto&&crypto.subtle)){say('Indisponible dans ce navigateur.');return}
    STATE.auth.h=await authHash(nid.value,npw.value);nid.value='';npw.value='';say('Identifiants modifiés. Publie pour les enregistrer.');updateBar()}));
  box.appendChild(ac);
}

/* Help tab */
function renderHelp(box){
  var c=h('div','card help');c.appendChild(h('h3',null,'Comment ça marche'));
  var ul=h('ul');
  ['Tout ce que tu modifies ici s\'affiche tout de suite dans ton aperçu, mais reste privé tant que tu n\'as pas cliqué sur « Publier ».',
   '« Publier » met la nouvelle version en ligne pour tous les visiteurs. La page se recharge ensuite.',
   '« Annuler les changements » revient à la dernière version publiée.',
   'Ce bouton Admin n\'apparaît que pour toi. Les visiteurs ne le voient jamais.'].forEach(function(t){ul.appendChild(h('li',null,t))});
  c.appendChild(ul);box.appendChild(c);
  var s=h('div','card help');s.appendChild(h('h3',null,'Rendre le site public'));
  var ul2=h('ul');
  ['Ouvre le menu Partager de cette page, en haut de l\'application.',
   'Choisis l\'accès par lien pour que toute personne qui a le lien puisse la voir, sans compte.',
   'Copie le lien et envoie-le : c\'est l\'adresse de ton site.'].forEach(function(t){ul2.appendChild(h('li',null,t))});
  s.appendChild(ul2);box.appendChild(s);
}

/* ---------- Boot ---------- */
renderSite();
(async function(){
  try{
    if(!window.claude||!claude.use)return;
    var user=await claude.use('user');
    isAdmin=!!(user&&(await user.canEdit()));
    if(!isAdmin)return;
    var art=await claude.use('artifact');
    if(art)buildAdmin();
  }catch(err){}
})();
</script>
